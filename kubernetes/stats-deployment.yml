apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats
    spec:
      containers:
        - name: stats
          image: shoplist-stats:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend:5000  
          ports:        
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10


