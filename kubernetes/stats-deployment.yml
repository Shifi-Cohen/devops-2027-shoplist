# stats-deployment.yml - your turn (step 9a). Same pattern as backend-deployment.yml
# stats has no Secret: it only talks to the backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: shoplist
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats                # exactly the same label as above
    spec:
      containers:
        - name: stats
          image: shoplist-stats:local
          imagePullPolicy: Never
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config       # name of the ConfigMap (app-config.yml)
                  key: BACKEND_URL       # which key to take from it
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
