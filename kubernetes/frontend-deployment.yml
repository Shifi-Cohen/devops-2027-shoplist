# frontend-deployment.yml - your turn (step 9c)
# Copied from stats-deployment.yml, without env, Secret and readinessProbe
#
# Before apply: kubectl apply --dry-run=server -f kubernetes/frontend-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shoplist
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend            # exactly the same label as above
    spec:
      containers:
        - name: frontend
          image: shoplist-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80  # Nginx port
